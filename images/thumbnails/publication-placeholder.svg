<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-labelledby="title desc">
  <title id="title">Publication thumbnail placeholder</title>
  <desc id="desc">Neutral placeholder suggesting a paper figure.</desc>
  <rect width="360" height="240" fill="#f4f6f8" rx="6" />
  <rect x="1" y="1" width="358" height="238" fill="none" stroke="#e1e4e8" stroke-width="2" rx="6" />
  <!-- abstract figure: sketched chart panel -->
  <g stroke="#d0d7de" stroke-width="2" fill="none">
    <rect x="52" y="44" width="152" height="104" rx="4" />
    <polyline points="66,128 100,96 128,110 154,72 190,84" stroke="#b6c2cd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- abstract text lines -->
  <g fill="#e1e4e8">
    <rect x="224" y="52" width="84" height="8" rx="4" />
    <rect x="224" y="72" width="68" height="8" rx="4" />
    <rect x="224" y="92" width="76" height="8" rx="4" />
    <rect x="224" y="112" width="56" height="8" rx="4" />
    <rect x="52" y="164" width="256" height="8" rx="4" />
    <rect x="52" y="184" width="220" height="8" rx="4" />
  </g>
  <text x="180" y="222" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#9aa4ad">FIGURE COMING SOON</text>
</svg>
